[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true

[runtime]
window_title = "Contra - Legacy of War Recompiled"
memcard_dir = "saves"
overlay_cache = true
# OVER8 select-player compat: both 2-arg memset(dst,0x3C) wrappers dispatch
# A0:0x2B with $a2 never set (latent game bug — real HW ran on a register
# leftover, and under the recompiler it diverges, wrapping the fill over 2MB
# of RAM and clobbering the kernel dispatch stubs). Force the length the
# layout proves: each fill region ends exactly at the next structure
# (0x80100E0C+0x3C=0x80100E48, 0x80100E6C+0x3C=0x80100EA8). Values are the
# dispatch return addresses ($ra) of the two jal sites.
a0_memset_len_sites = [0x800FE590, 0x800FFD18]
a0_memset_len       = 0x3C
# DEV/PLAYTEST AID: per-frame GameShark-style freezes from the published
# SLUS-00288 codes. Infinite lives P1/P2 (0x800DC784/0x800DC7AC = 9), infinite
# continues (0x800DEC92 = 9), P1/P2 invincible (0x8008C9D4/0x8008CA9C = 0x60 —
# the flag the game checks). GATED by the in-game menu's God mode toggle
# (≡ → Cheats; it writes/deletes files/god_mode, live, no restart).
cheat_freeze_addrs  = [0x800DC784, 0x800DC7AC, 0x800DEC92, 0x8008C9D4, 0x8008CA9C]
cheat_freeze_values = [0x0009,     0x0009,     0x0009,     0x0060,     0x0060]

[video]
renderer = "opengl"
aspect_ratio = "4:3"

[controller]
default_mode = "digital"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 12
required_disc_fp = "31378eb9797de834bc3bce6e1b00b2f7a73754b0faf067afc9784da64274089b"
